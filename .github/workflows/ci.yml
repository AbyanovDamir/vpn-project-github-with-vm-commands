name: project-check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Static project verification
        run: python scripts/verify_project.py
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Run OAuth integration test
        shell: bash
        run: |
          python app/oauth_server.py >oauth.log 2>&1 &
          python app/web_app.py >web.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            sleep 1
          done
          python scripts/integration_oauth_test.py
