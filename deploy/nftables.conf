#!/usr/sbin/nft -f
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    iif "lo" accept
    ip protocol icmp accept

    # Администрирование и VPN handshake на публичном интерфейсе.
    tcp dport 22 accept
    udp dport 51820 accept

    # Веб-приложение и OAuth доступны только из WireGuard-туннеля.
    iifname "wg0" ip saddr 10.20.0.0/24 tcp dport { 8080, 9000 } accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    iifname "wg0" accept
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}

